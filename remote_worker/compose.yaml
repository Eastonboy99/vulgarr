services:
  worker-0:
    build: .
    restart: unless-stopped
    ports: ["7861:7861"]
    environment:
      SPF_SOURCE_BASE_URL: ${SPF_SOURCE_BASE_URL:-}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    volumes: ["models-0:/models"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${SPF_GPU_0:-0}"]
              capabilities: [gpu]
  worker-1:
    build: .
    restart: unless-stopped
    ports: ["7862:7861"]
    environment:
      SPF_SOURCE_BASE_URL: ${SPF_SOURCE_BASE_URL:-}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    volumes: ["models-1:/models"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${SPF_GPU_1:-1}"]
              capabilities: [gpu]
volumes:
  models-0:
  models-1:
