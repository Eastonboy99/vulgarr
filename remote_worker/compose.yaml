services:
  worker-0:
    build: .
    restart: unless-stopped
    ports: ["7861:7861"]
    environment:
      # device_ids reservation is ignored on Docker Desktop/WSL2 -- pin the GPU
      # explicitly or every container sees all devices and defaults to GPU 0.
      # CUDA_VISIBLE_DEVICES is the one the CUDA runtime itself honors there.
      NVIDIA_VISIBLE_DEVICES: "${SPF_GPU_0:-0}"
      CUDA_VISIBLE_DEVICES: "${SPF_GPU_0:-0}"
      SPF_SOURCE_BASE_URL: ${SPF_SOURCE_BASE_URL:-}
      SPF_RENDER_WORK_DIR: /work
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    volumes: ["models-0:/models", "renders-0:/work"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${SPF_GPU_0:-0}"]
              capabilities: [gpu]
  worker-1:
    build: .
    restart: unless-stopped
    ports: ["7862:7861"]
    environment:
      NVIDIA_VISIBLE_DEVICES: "${SPF_GPU_1:-1}"
      CUDA_VISIBLE_DEVICES: "${SPF_GPU_1:-1}"
      SPF_SOURCE_BASE_URL: ${SPF_SOURCE_BASE_URL:-}
      SPF_RENDER_WORK_DIR: /work
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    volumes: ["models-1:/models", "renders-1:/work"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${SPF_GPU_1:-1}"]
              capabilities: [gpu]
volumes:
  models-0:
  models-1:
  renders-0:
  renders-1:
